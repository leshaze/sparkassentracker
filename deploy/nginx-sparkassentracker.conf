# Variante B: eigener nginx-Server-Block auf Port 8081, neben Recordloom
# Kopieren nach /etc/nginx/sites-available/sparkassentracker
# und verlinken nach /etc/nginx/sites-enabled/
#
# Den fastcgi_pass-Socket an die installierte PHP-Version anpassen
# (gleicher Socket wie bei Recordloom, z.B. php8.4-fpm.sock).

server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    root /opt/sparkassentracker/public;
    index index.php;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location ~ /\. {
        deny all;
    }
}
