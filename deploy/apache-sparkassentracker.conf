# Variante B (Apache): eigener VirtualHost auf Port 8081, neben Recordloom
# Kopieren nach /etc/apache2/sites-available/sparkassentracker.conf
# In /etc/apache2/ports.conf zusätzlich:  Listen 8081
# Dann: sudo a2ensite sparkassentracker && sudo systemctl reload apache2

<VirtualHost *:8081>
    DocumentRoot /opt/sparkassentracker/public

    <Directory /opt/sparkassentracker/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/sparkassentracker_error.log
    CustomLog ${APACHE_LOG_DIR}/sparkassentracker_access.log combined
</VirtualHost>
