# Sparkassentracker unter http://recordloom.local/tracker/
#
# Diesen Block INNERHALB des bestehenden server { ... } von Recordloom einfügen,
# am besten oberhalb von "location /" und "location ~ \.php$".
# Socket-Pfad an die PHP-Version anpassen (gleicher wie bei Recordloom).

    location = /tracker { return 301 /tracker/; }

    location ^~ /tracker/ {
        alias /var/www/sparkassentracker/public/;
        index index.php;
        client_max_body_size 20M;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        }
    }
